services:
  - type: web
    name: vanessa-web
    env: dotnet
    plan: free
    branch: main
    buildCommand: cd Vanessa/Vanessa && dotnet publish -c Release -o publish
    startCommand: cd Vanessa/Vanessa/publish && dotnet Vanessa.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: vanessa-db

databases:
  - name: vanessa-db
    engine: postgresql
    plan: starter
